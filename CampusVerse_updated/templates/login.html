{% extends "base.html" %}

{% block title %}Login - CampusVerse{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow fade-in-up">
            <div class="card-body text-center p-4">
                <!-- Logo -->
                <div class="mb-4">
                    <div class="icon-container" style="width: 80px; height: 80px;">
                        <i class="fas fa-graduation-cap fa-2x"></i>
                    </div>
                    <h3 class="mt-3 mb-1 text-gradient">CampusVerse</h3>
                    <p class="text-muted small">Your Campus. Your Community. One Place.</p>
                </div>

                <h5 class="mb-4">Welcome Back</h5>
                <p class="text-muted small mb-4">Login to stay connected with your campus</p>

                <!-- Role Toggle -->
                <div class="d-flex justify-content-center mb-4">
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-primary active" id="studentBtn">Student</button>
                        <button type="button" class="btn btn-outline-primary" id="adminBtn">Admin</button>
                    </div>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Roll Number / Email" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-muted small" for="rememberMe">
                                Remember me
                            </label>
                        </div>
                        <a href="#" class="text-primary small">Forgot Password?</a>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Login
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted small mb-2">or continue with</p>
                    <div class="d-flex justify-content-center gap-2">
                        <button class="btn btn-light btn-sm" style="width: 50px;">
                            <i class="fab fa-google"></i>
                        </button>
                        <button class="btn btn-light btn-sm" style="width: 50px;">
                            <i class="fab fa-microsoft"></i>
                        </button>
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <p class="text-muted small">New here? <a href="{{ url_for('register') }}" class="text-primary">Create an account</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('studentBtn').addEventListener('click', function() {
    this.classList.add('active');
    document.getElementById('adminBtn').classList.remove('active');
});

document.getElementById('adminBtn').addEventListener('click', function() {
    this.classList.add('active');
    document.getElementById('studentBtn').classList.remove('active');
});
</script>
{% endblock %}
